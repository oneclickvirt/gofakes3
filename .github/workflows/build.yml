name: build
jobs:
  build:
    if: ${{ github.event.inputs.manual == 'true' || (github.repository == 'rclone/gofakes3' && (github.event_name
      != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name))
      }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job_name:
        - linux
        - linux_386
        - mac_amd64
        - mac_arm64
        - windows
        - go1.20
        - go1.21
        include:
        - job_name: linux
          os: ubuntu-latest
          go: '>=1.22.0-rc.1'
        - job_name: linux_386
          os: ubuntu-latest
          go: '>=1.22.0-rc.1'
        - job_name: mac_amd64
          os: macos-latest
          go: '>=1.22.0-rc.1'
        - job_name: mac_arm64
          os: macos-latest
          go: '>=1.22.0-rc.1'
        - job_name: windows
          os: windows-latest
          go: '>=1.22.0-rc.1'
        - job_name: go1.20
          os: ubuntu-latest
          go: '1.20'
        - job_name: go1.21
          os: ubuntu-latest
          go: '1.21'
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        check-latest: true
    - name: Print Go version and environment
      shell: bash
      run: |
        printf "Using go at: $(which go)\n"
        printf "Go version: $(go version)\n"
        printf "\n\nGo environment:\n\n"
        go env
        printf "\n\nSystem environment:\n\n"
        env
    - name: Go module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Build
      shell: bash
      run: |
        go install ./...
    - name: Run tests
      shell: bash
      run: |
        go test ./...
    - name: Race test
      shell: bash
      run: |
        go test -race ./...
    env:
      GOPROXY: https://proxy.golang.org|direct
  lint:
    if: ${{ github.event.inputs.manual == 'true' || (github.repository == 'rclone/gofakes3' && (github.event_name
      != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name))
      }}
    timeout-minutes: 30
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Code quality test
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '>=1.22.0-rc.1'
        check-latest: true
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    - name: Scan for vulnerabilities
      run: govulncheck ./...
    env:
      GOPROXY: https://proxy.golang.org|direct
'on':
  push:
    branches:
    - '**'
    tags:
    - '**'
  pull_request: null
  workflow_dispatch:
    inputs:
      manual:
        description: Manual run (bypass default conditions)
        type: boolean
        required: true
        default: true
